[build]
  # Netlify's build image can install Flutter on the fly, then build web output.
  publish = "build/web"
  command = """
    if [ ! -d "$HOME/flutter" ]; then \
      git clone https://github.com/flutter/flutter.git -b stable --depth 1 "$HOME/flutter"; \
    fi && \
    export PATH="$HOME/flutter/bin:$PATH" && \
    flutter config --enable-web && \
    flutter pub get && \
    flutter build web --release
  """

# Flutter web is a single-page app: route all unknown paths to index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
