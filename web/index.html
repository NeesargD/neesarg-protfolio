<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description"
        content="Neesarg Darji — Senior Flutter Developer. 5+ years shipping production iOS & Android apps in healthcare and e-commerce.">
  <meta name="theme-color" content="#0A0908">

  <!-- Open Graph -->
  <meta property="og:title" content="Neesarg Darji — Senior Flutter Developer">
  <meta property="og:description"
        content="5+ years shipping production iOS & Android apps. Architecture, stability and data-driven crash reduction.">
  <meta property="og:type" content="website">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Neesarg Darji">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Adaptive "ND" favicon: orange in dark mode, blue-green in light mode. -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Neesarg Darji — Senior Flutter Developer</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #0A0908;
      overflow: hidden;
    }
    /* Warm-dark boot screen shown until Flutter paints, so there is no flash. */
    #boot {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: flex-end;
      justify-content: flex-start;
      padding: 32px;
      background: #0A0908;
      color: #5A554E;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 12px;
      letter-spacing: 1.5px;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }
    #boot .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #FF5A1F; margin-right: 10px;
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:.3} 50%{opacity:1} }
  </style>
</head>
<body>
  <div id="boot"><span class="dot"></span>NEESARG DARJI · LOADING</div>

  <script>
    // Hide the boot screen once Flutter's first frame is up.
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('boot');
      if (boot) { boot.style.opacity = '0'; setTimeout(function(){ boot.remove(); }, 400); }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
